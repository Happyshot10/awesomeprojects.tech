name: Install DNSControl
description: Installs a pinned, checksum-verified DNSControl binary
inputs:
  version:
    default: "5.5.0"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        v="${{ inputs.version }}"
        f="dnscontrol_${v}_linux_amd64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/StackExchange/dnscontrol/releases/download/v${v}/${f}"
        curl -fsSLO "https://github.com/StackExchange/dnscontrol/releases/download/v${v}/checksums.txt"
        grep " ${f}\$" checksums.txt | sha256sum -c -
        tar -xzf "$f" dnscontrol
        sudo install dnscontrol /usr/local/bin/dnscontrol
        dnscontrol version
