name: Validate request

on:
  pull_request:
    branches: [main]

# Plain pull_request (never pull_request_target): fork PRs get a read-only token and no secrets.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
      - name: Check out main (trusted rules)
        uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the request (main's validator, PR's files)
        run: node trusted/scripts/validate.js --pr
        env:
          CHECK_ROOT: pr
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAINTAINERS: ${{ github.repository_owner }}

      - name: Unit tests (PR's copy, for changes to the rules)
        run: node --test test/
        working-directory: pr

      - uses: ./trusted/.github/actions/dnscontrol
      - name: DNSControl check
        run: dnscontrol check
        working-directory: pr
